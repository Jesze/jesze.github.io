<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Simulacrum Header Prototype</title>
  <link rel="stylesheet" href="styles.css">
</head>

<body> 

<header class="site-header">

  <div class="banner-frame" aria-hidden="true">
    <div class="banner-piece banner-left"></div>
    <div class="banner-piece banner-left-stretch"></div>
    <div class="banner-piece banner-center"></div>
    <div class="banner-piece banner-right-stretch"></div>
    <div class="banner-piece banner-right"></div>
  </div>

  <div class="header-content">

    <a class="brand" href="#">
      <img class="brand-logo" src="assets/header/simulacrum-logo.png" alt="Simulacrum Interactive">
    </a>

    <nav class="main-nav" aria-label="Main navigation">
      <a class="nav-button" href="#about">
        <span class="nav-icon" aria-hidden="true">◆</span>
        <span class="nav-label">About</span>
      </a>

      <a class="nav-button" href="#brobots">
        <span class="nav-icon" aria-hidden="true">▲</span>
        <span class="nav-label">Brobots</span>
      </a>

      <a class="nav-button" href="#etherian">
        <span class="nav-icon" aria-hidden="true">✦</span>
        <span class="nav-label">Etherian</span>
      </a>

      <a class="nav-button" href="#halodoom">
        <span class="nav-icon" aria-hidden="true">■</span>
        <span class="nav-label">Halodoom</span>
      </a>

      <a class="nav-button" href="#contact">
        <span class="nav-icon" aria-hidden="true">●</span>
        <span class="nav-label">Contact</span>
      </a>
    </nav>

    <button class="menu-toggle" type="button" aria-label="Open menu">
      <span class="menu-toggle-lines" aria-hidden="true"></span>
    </button>

  </div>

</header>

<main class="page-demo">
</main>
</body>
</html>
