<body>

  <!-- =====================================================
       Fixed viewport-frame anchor pieces
       =====================================================

       These eight anchor WebP pieces are intentionally rendered at their
       intrinsic aspect ratios. The four stretch strips underneath them
       use one reusable horizontal strip asset that can be rotated for
       the other three sides.
  -->
  <div class="viewport-frame" aria-hidden="true">
    <!-- Stretchable border fill strips.
         Put the provided strip asset at: assets/header/border-stretch.webp -->
    <img
      class="viewport-frame-stretch viewport-frame-stretch--top"
      src="assets/header/border-stretch.webp"
      alt=""
      draggable="false"
    >

    <img
      class="viewport-frame-stretch viewport-frame-stretch--right"
      src="assets/header/border-stretch.webp"
      alt=""
      draggable="false"
    >

    <img
      class="viewport-frame-stretch viewport-frame-stretch--bottom"
      src="assets/header/border-stretch.webp"
      alt=""
      draggable="false"
    >

    <img
      class="viewport-frame-stretch viewport-frame-stretch--left"
      src="assets/header/border-stretch.webp"
      alt=""
      draggable="false"
    >

    <img
      class="viewport-frame-piece viewport-frame-piece--top-left"
      src="assets/header/border-topleft.webp"
      alt=""
      draggable="false"
    >

    <img
      class="viewport-frame-piece viewport-frame-piece--top"
      src="assets/header/border-top.webp"
      alt=""
      draggable="false"

    <img

    <img

  <!-- Global blurred looping background video -->
  <div class="site-background" aria-hidden="true">

      class="site-background-video"
      autoplay
      muted

      playsinline

      aria-hidden="true"
      tabindex="-1"
    >

        src="assets/simulacrum-loop.mp4"
        type="video/mp4"

  </div>

<main class="page-demo">

  <!--
    Temporary page-frame targets for the five middle/icon-mode buttons.

    They intentionally all share the same visual shell for now. The
    current task is to establish page-to-page transition behavior before
    introducing unique content/designs.
  -->
  <section
    class="prototype-page-frame"
    id="about-page-frame"
    data-page="about"
    aria-hidden="true"
  >
    <svg
      class="prototype-page-frame-shell"
      preserveAspectRatio="none"
      aria-hidden="true"
    >
      <!--
        Structural frame layers.
        JavaScript redraws these from the same live rectangle used by
        the morph target, so the real frame stays aligned to the fake one.
      -->
      <path
        class="page-frame-ring"
        fill-rule="evenodd"
        clip-rule="evenodd"
      />

      <path class="page-frame-edge page-frame-edge--outer" />
      <path class="page-frame-edge page-frame-edge--chrome" />
      <path class="page-frame-edge page-frame-edge--inner" />

      <path class="page-frame-orange-rail" />
      <path class="page-frame-orange-highlight" />

      <!-- Decorative rails / micro-HUD details -->
      <g class="page-frame-side-details page-frame-side-details--left">
        <line class="page-frame-detail-line page-frame-detail-line--long" />
        <line class="page-frame-detail-line page-frame-detail-line--short" />
        <circle class="page-frame-detail-dot" r="1.4" />
        <circle class="page-frame-detail-dot" r="1.4" />
        <circle class="page-frame-detail-dot" r="1.4" />
        <circle class="page-frame-detail-dot" r="1.4" />
        <circle class="page-frame-detail-dot" r="1.4" />
      </g>

      <g class="page-frame-side-details page-frame-side-details--right">
        <line class="page-frame-detail-line page-frame-detail-line--long" />
        <line class="page-frame-detail-line page-frame-detail-line--short" />
        <circle class="page-frame-detail-dot" r="1.4" />
        <circle class="page-frame-detail-dot" r="1.4" />
        <circle class="page-frame-detail-dot" r="1.4" />
        <circle class="page-frame-detail-dot" r="1.4" />
        <circle class="page-frame-detail-dot" r="1.4" />
      </g>


      <!-- Bottom-center notch / indicator treatment -->
      <path class="page-frame-bottom-notch" />

      <g class="page-frame-bottom-dots">
        <circle r="1.5" />
        <circle r="1.5" />
        <circle r="1.5" />
        <circle r="1.5" />
        <circle r="1.5" />
        <circle r="1.5" />
      </g>
    </svg>

    <!--
      Real HTML page content will eventually live here.
      It is intentionally empty for now.
    -->

    <div class="desktop-secondary-panel" aria-hidden="true">
      <div class="desktop-secondary-panel-glass"></div>
      <div class="desktop-secondary-panel-content"></div>
    </div>

    <!--
      Etherian page module.

      The outer .prototype-page-frame-content remains owned by the global
      frame/morph system. Everything inside .game-page is page-specific and
      can later be swapped independently of the frame itself.
    -->
    <div
      class="prototype-page-frame-content"
      aria-label="Etherian page content"
    >
      <div class="game-page game-page--etherian">

        <!--
          Step 1 prototype:
          structural media-browser shell only.

          No real media or carousel behavior yet; these temporary regions
          let us verify sizing in tablet and desktop frame layouts first.
        -->
        <section
          class="media-browser"
          data-media-browser
          aria-label="Etherian media gallery"
        >

          <div
            class="media-viewer"
            data-media-viewer
            aria-live="polite"
          >
            <div class="media-viewer-stage" data-media-viewer-stage></div>
          </div>

          <div class="media-strip">
            <button
              class="media-arrow media-arrow--previous"
              type="button"
              data-media-prev
              aria-label="Previous media"
            >
              ‹
            </button>

            <div
              class="media-thumbnails"
              data-media-thumbnails
              aria-label="Etherian media thumbnails"
            >
              <button
                class="media-thumbnail is-selected"
                type="button"
                data-media-item
                data-media-type="youtube"
                data-media-title="Announcement Trailer"
                aria-label="Show Announcement Trailer"
                data-youtube-id="f1XcuUs06lQ"
                data-media-thumb="https://i.ytimg.com/vi/f1XcuUs06lQ/hqdefault.jpg"
              >
                  <img
                    class="media-thumbnail-image"
                    src="https://i.ytimg.com/vi/f1XcuUs06lQ/hqdefault.jpg"
                    alt=""
                    loading="lazy"
                    decoding="async"
                  >
                  <span class="media-thumbnail-overlay">
                    <span class="media-thumbnail-play" aria-hidden="true">▶</span>
                    <span class="media-thumbnail-type">VIDEO</span>
                  </span>
